name: build-container-images

on:
  workflow_dispatch:
  push:
    branches:
      - anarkis/test-docker-issue

env:
  PUBLIC_REGISTRY: docker.io
  REPO: rancherlabs
  GITHUB_ACTION_TAG: ${{ github.ref_name }}

jobs:
  docker:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: "Read some Secrets"
        uses: rancher-eio/read-vault-secrets@main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            rancherlabs/swiss-army-knife
          tags: |
            type=raw,value=${{ env.VERSION_NUMBER }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile
          tags: rancherlabs/swiss-army-knife:test

      - name: Build and push image
        uses: rancher/ecm-distro-tools/actions/publish-image@master
        with:
          image: swiss-army-knife
          tag: test
          platforms: "linux/amd64,linux/arm64"

          public-registry: ${{ env.PUBLIC_REGISTRY }}
          public-repo: ${{ env.REPO }}
          public-username: ${{ env.DOCKER_USERNAME }}
          public-password: ${{ env.DOCKER_PASSWORD }}
          
          push-to-prime: false
          #prime-repo: rancherlabs
          #prime-registry: ${{ env.PRIME_REGISTRY }}
          #prime-username: ${{ env.PRIME_REGISTRY_USERNAME }}
          #prime-password: ${{ env.PRIME_REGISTRY_PASSWORD }}